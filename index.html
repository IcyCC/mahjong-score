<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🀄 麻将计分器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #d4201e 0%, #a01010 100%);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
        }
        
        .header {
            text-align: center;
            color: #ffd700;
            margin-bottom: 15px;
            padding: 10px 0;
        }
        
        .header h1 {
            font-size: 1.6em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 0.95em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .card-title {
            font-size: 1.1em;
            color: #d4201e;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        /* 玩家设置 - 横向排列 */
        .players-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .player-item {
            flex: 1;
            min-width: 70px;
        }
        
        .player-item label {
            display: block;
            font-size: 0.75em;
            color: #888;
            margin-bottom: 4px;
            text-align: center;
        }
        
        .player-item input {
            width: 100%;
            padding: 10px 8px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1em;
            text-align: center;
        }
        
        .player-item input:focus {
            outline: none;
            border-color: #d4201e;
        }
        
        /* 分数卡片 - 2x2 网格 */
        .scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .score-card {
            background: #fff5f5;
            border: 2px solid #ffd700;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
        }
        
        .score-card.win {
            background: linear-gradient(180deg, #e8f5e9 0%, #fff 100%);
            border-color: #4caf50;
        }
        
        .score-card.lose {
            background: linear-gradient(180deg, #ffebee 0%, #fff 100%);
            border-color: #f44336;
        }
        
        .score-name {
            font-size: 0.95em;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        
        .score-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .score-value.positive { color: #4caf50; }
        .score-value.negative { color: #f44336; }
        .score-value.zero { color: #999; }
        
        /* 统计 */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .stat-box {
            flex: 1;
            background: #f8f8f8;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .stat-num {
            font-size: 1.4em;
            font-weight: bold;
            color: #d4201e;
        }
        
        .stat-label {
            font-size: 0.75em;
            color: #888;
            margin-top: 3px;
        }
        
        /* 记分表单 */
        .form-section {
            margin-bottom: 15px;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .form-col {
            flex: 1;
        }
        
        .form-col label {
            display: block;
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .form-col select,
        .form-col input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1em;
            background: #fff;
        }
        
        .form-col select:focus,
        .form-col input:focus {
            outline: none;
            border-color: #d4201e;
        }
        
        /* 赢法选择按钮 */
        .win-type-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .win-type-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #f8f8f8;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .win-type-btn.active {
            border-color: #d4201e;
            background: #fff5f5;
            color: #d4201e;
            font-weight: 600;
        }
        
        .win-type-desc {
            font-size: 0.75em;
            color: #888;
            margin-top: 4px;
        }
        
        /* 按钮 */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #d4201e 0%, #a01010 100%);
            color: white;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
            margin-top: 8px;
            padding: 12px;
            font-size: 0.95em;
        }
        
        /* 历史记录 */
        .history-list {
            max-height: 250px;
            overflow-y: auto;
        }
        
        .history-item {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .history-title {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }
        
        .history-type {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 10px;
            background: #ffd700;
            color: #333;
        }
        
        .history-type.dianpao {
            background: #90caf9;
        }
        
        .history-detail {
            font-size: 0.85em;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .history-detail span {
            background: #fff;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .history-detail span.pos { color: #4caf50; }
        .history-detail span.neg { color: #f44336; }
        
        .history-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.8em;
            color: #999;
        }
        
        .history-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85em;
        }
        
        .empty {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }
        
        /* 底部固定 */
        .footer-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent, #a01010 20%);
            padding: 15px;
            padding-bottom: 25px;
        }
        
        .footer-content {
            text-align: center;
            color: rgba(255,215,0,0.8);
            font-size: 0.8em;
        }
        
        @media (min-width: 500px) {
            body {
                max-width: 450px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🀄 麻将计分器</h1>
        <p>🧧 新年快乐，恭喜发财 🧧</p>
    </div>
    
    <!-- 玩家设置 -->
    <div class="card">
        <div class="card-title">👥 玩家</div>
        <div class="players-row">
            <div class="player-item">
                <label>东</label>
                <input type="text" id="p0" value="东">
            </div>
            <div class="player-item">
                <label>南</label>
                <input type="text" id="p1" value="南">
            </div>
            <div class="player-item">
                <label>西</label>
                <input type="text" id="p2" value="西">
            </div>
            <div class="player-item">
                <label>北</label>
                <input type="text" id="p3" value="北">
            </div>
        </div>
    </div>
    
    <!-- 当前分数 -->
    <div class="card">
        <div class="card-title">📊 当前分数</div>
        <div class="scores-grid" id="scoresGrid"></div>
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-num" id="totalRounds">0</div>
                <div class="stat-label">总局数</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" id="totalFlow">¥0</div>
                <div class="stat-label">总流水</div>
            </div>
        </div>
    </div>
    
    <!-- 记录一局 -->
    <div class="card">
        <div class="card-title">✍️ 记录本局</div>
        
        <div class="win-type-btns">
            <button class="win-type-btn active" id="btnZimo" onclick="setWinType('zimo')">
                🎯 自摸
                <div class="win-type-desc">收三家</div>
            </button>
            <button class="win-type-btn" id="btnDianpao" onclick="setWinType('dianpao')">
                💥 点炮
                <div class="win-type-desc">点炮者付</div>
            </button>
        </div>
        
        <div class="form-section">
            <div class="form-row">
                <div class="form-col">
                    <label>赢家</label>
                    <select id="winner"></select>
                </div>
                <div class="form-col" id="dianpaoCol" style="display:none;">
                    <label>点炮者</label>
                    <select id="dianpao"></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-col">
                    <label>金额（每家/份）</label>
                    <input type="number" id="amount" placeholder="输入金额" inputmode="numeric">
                </div>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="addRound()">✅ 记录本局</button>
    </div>
    
    <!-- 历史记录 -->
    <div class="card">
        <div class="card-title">📜 历史记录</div>
        <div class="history-list" id="historyList">
            <div class="empty">暂无记录</div>
        </div>
        <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空所有</button>
    </div>
    
    <div class="footer-fixed">
        <div class="footer-content">🀄 祝您把把自摸，杠上开花！</div>
    </div>

    <script>
        let players = ['东', '南', '西', '北'];
        let scores = [0, 0, 0, 0];
        let history = [];
        let roundCount = 0;
        let winType = 'zimo'; // zimo 或 dianpao
        
        function init() {
            load();
            updatePlayerSelects();
            render();
        }
        
        function load() {
            const data = localStorage.getItem('mj_score');
            if (data) {
                const d = JSON.parse(data);
                players = d.players || players;
                scores = d.scores || scores;
                history = d.history || [];
                roundCount = d.roundCount || 0;
            }
            for (let i = 0; i < 4; i++) {
                document.getElementById('p' + i).value = players[i];
            }
        }
        
        function save() {
            localStorage.setItem('mj_score', JSON.stringify({
                players, scores, history, roundCount
            }));
        }
        
        function getNames() {
            for (let i = 0; i < 4; i++) {
                players[i] = document.getElementById('p' + i).value.trim() || ['东','南','西','北'][i];
            }
        }
        
        function updatePlayerSelects() {
            const winnerSel = document.getElementById('winner');
            const dianpaoSel = document.getElementById('dianpao');
            
            winnerSel.innerHTML = '<option value="">选赢家</option>';
            dianpaoSel.innerHTML = '<option value="">选点炮者</option>';
            
            for (let i = 0; i < 4; i++) {
                winnerSel.innerHTML += `<option value="${i}">${players[i]}</option>`;
                dianpaoSel.innerHTML += `<option value="${i}">${players[i]}</option>`;
            }
        }
        
        function setWinType(type) {
            winType = type;
            document.getElementById('btnZimo').classList.toggle('active', type === 'zimo');
            document.getElementById('btnDianpao').classList.toggle('active', type === 'dianpao');
            document.getElementById('dianpaoCol').style.display = type === 'dianpao' ? 'block' : 'none';
        }
        
        function render() {
            // 分数卡片
            const grid = document.getElementById('scoresGrid');
            let totalFlow = 0;
            grid.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const s = scores[i];
                totalFlow += Math.abs(s);
                
                let cls = '';
                let vcls = 'zero';
                if (s > 0) { cls = 'win'; vcls = 'positive'; }
                else if (s < 0) { cls = 'lose'; vcls = 'negative'; }
                
                grid.innerHTML += `
                    <div class="score-card ${cls}">
                        <div class="score-name">${players[i]}</div>
                        <div class="score-value ${vcls}">${s >= 0 ? '+' : ''}${s}</div>
                    </div>
                `;
            }
            
            document.getElementById('totalRounds').textContent = roundCount;
            document.getElementById('totalFlow').textContent = '¥' + totalFlow;
            
            // 历史记录
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div class="empty">暂无记录</div>';
            } else {
                list.innerHTML = history.map((h, idx) => `
                    <div class="history-item">
                        <div class="history-header">
                            <span class="history-title">第${h.round}局 · ${h.winnerName} 赢</span>
                            <span class="history-type ${h.type === 'dianpao' ? 'dianpao' : ''}">${h.type === 'zimo' ? '自摸' : '点炮'}</span>
                        </div>
                        <div class="history-detail">
                            ${h.changes.map((c, i) => 
                                `<span class="${c >= 0 ? 'pos' : 'neg'}">${players[i]}: ${c >= 0 ? '+' : ''}${c}</span>`
                            ).join('')}
                        </div>
                        <div class="history-footer">
                            <span>${h.time}</span>
                            <button class="history-delete" onclick="delRound(${idx})">撤销</button>
                        </div>
                    </div>
                `).join('');
            }
            
            updatePlayerSelects();
        }
        
        function addRound() {
            const winnerIdx = parseInt(document.getElementById('winner').value);
            const amount = parseInt(document.getElementById('amount').value);
            const dianpaoIdx = parseInt(document.getElementById('dianpao').value);
            
            if (isNaN(winnerIdx)) {
                alert('请选择赢家');
                return;
            }
            if (!amount || amount <= 0) {
                alert('请输入有效金额');
                return;
            }
            if (winType === 'dianpao' && isNaN(dianpaoIdx)) {
                alert('请选择点炮者');
                return;
            }
            if (winType === 'dianpao' && winnerIdx === dianpaoIdx) {
                alert('赢家和点炮者不能是同一人');
                return;
            }
            
            getNames();
            
            const changes = [0, 0, 0, 0];
            
            if (winType === 'zimo') {
                // 自摸：赢家+3倍，其他三家各-1倍
                for (let i = 0; i < 4; i++) {
                    if (i === winnerIdx) {
                        changes[i] = amount * 3;
                        scores[i] += amount * 3;
                    } else {
                        changes[i] = -amount;
                        scores[i] -= amount;
                    }
                }
            } else {
                // 点炮：赢家+1倍，点炮者-1倍
                changes[winnerIdx] = amount;
                scores[winnerIdx] += amount;
                changes[dianpaoIdx] = -amount;
                scores[dianpaoIdx] -= amount;
            }
            
            roundCount++;
            
            history.unshift({
                round: roundCount,
                type: winType,
                winner: winnerIdx,
                winnerName: players[winnerIdx],
                dianpao: winType === 'dianpao' ? dianpaoIdx : null,
                dianpaoName: winType === 'dianpao' ? players[dianpaoIdx] : null,
                amount: amount,
                changes: changes,
                time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})
            });
            
            save();
            render();
            
            // 清空输入
            document.getElementById('winner').value = '';
            document.getElementById('dianpao').value = '';
            document.getElementById('amount').value = '';
        }
        
        function delRound(idx) {
            if (!confirm('确定撤销这局？')) return;
            
            const h = history[idx];
            for (let i = 0; i < 4; i++) {
                scores[i] -= h.changes[i];
            }
            history.splice(idx, 1);
            roundCount--;
            
            save();
            render();
        }
        
        function clearAll() {
            if (!confirm('确定清空所有记录？')) return;
            
            players = ['东', '南', '西', '北'];
            scores = [0, 0, 0, 0];
            history = [];
            roundCount = 0;
            
            for (let i = 0; i < 4; i++) {
                document.getElementById('p' + i).value = players[i];
            }
            
            localStorage.removeItem('mj_score');
            render();
        }
        
        // 监听名字变化
        for (let i = 0; i < 4; i++) {
            document.getElementById('p' + i).addEventListener('input', () => {
                getNames();
                save();
                render();
            });
        }
        
        init();
    </script>
</body>
</html>
