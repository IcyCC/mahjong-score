<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄 麻将计分器 - 新年快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card-title {
            font-size: 1.3em;
            color: #c41e3a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .player-input {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .player-input label {
            font-size: 0.9em;
            color: #666;
        }
        
        .player-input input {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }
        
        .player-input input:focus {
            outline: none;
            border-color: #c41e3a;
        }
        
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .score-card {
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .score-card:hover {
            transform: translateY(-5px);
        }
        
        .score-card.positive {
            background: linear-gradient(135deg, #d4edda 0%, #fff 100%);
            border-color: #28a745;
        }
        
        .score-card.negative {
            background: linear-gradient(135deg, #f8d7da 0%, #fff 100%);
            border-color: #dc3545;
        }
        
        .score-name {
            font-size: 1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .score-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .score-value.positive {
            color: #28a745;
        }
        
        .score-value.negative {
            color: #dc3545;
        }
        
        .score-value.zero {
            color: #666;
        }
        
        .round-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group.full {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-size: 0.9em;
            color: #666;
        }
        
        .form-group select, .form-group input {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
        }
        
        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: #c41e3a;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: white;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(196, 30, 58, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .history {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .history-info {
            flex: 1;
        }
        
        .history-round {
            font-weight: bold;
            color: #333;
        }
        
        .history-detail {
            font-size: 0.9em;
            color: #666;
            margin-top: 3px;
        }
        
        .history-time {
            font-size: 0.8em;
            color: #999;
        }
        
        .history-delete {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 10px;
        }
        
        .history-delete:hover {
            background: #c82333;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #c41e3a;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .footer {
            text-align: center;
            color: rgba(255, 215, 0, 0.7);
            padding: 20px;
            font-size: 0.9em;
        }
        
        /* 装饰灯笼 */
        .lantern {
            position: fixed;
            top: 10px;
            font-size: 3em;
            animation: swing 3s ease-in-out infinite;
            opacity: 0.8;
        }
        
        .lantern-left {
            left: 20px;
        }
        
        .lantern-right {
            right: 20px;
            animation-delay: 0.5s;
        }
        
        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        @media (max-width: 500px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .scores-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .score-value {
                font-size: 1.4em;
            }
            
            .lantern {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="lantern lantern-left">🏮</div>
    <div class="lantern lantern-right">🏮</div>
    
    <div class="container">
        <div class="header">
            <h1>🀄 麻将计分器</h1>
            <p>🧧 新年快乐，恭喜发财 🧧</p>
        </div>
        
        <!-- 玩家设置 -->
        <div class="card">
            <div class="card-title">👥 玩家设置</div>
            <div class="players-grid">
                <div class="player-input">
                    <label>东家 (位置1)</label>
                    <input type="text" id="player1" placeholder="输入名字" value="东">
                </div>
                <div class="player-input">
                    <label>南家 (位置2)</label>
                    <input type="text" id="player2" placeholder="输入名字" value="南">
                </div>
                <div class="player-input">
                    <label>西家 (位置3)</label>
                    <input type="text" id="player3" placeholder="输入名字" value="西">
                </div>
                <div class="player-input">
                    <label>北家 (位置4)</label>
                    <input type="text" id="player4" placeholder="输入名字" value="北">
                </div>
            </div>
        </div>
        
        <!-- 当前分数 -->
        <div class="card">
            <div class="card-title">📊 当前分数</div>
            <div class="scores-grid" id="scoresGrid">
                <!-- 动态生成 -->
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalRounds">0</div>
                    <div class="stat-label">总局数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalMoney">¥0</div>
                    <div class="stat-label">总流水</div>
                </div>
            </div>
        </div>
        
        <!-- 记录一局 -->
        <div class="card">
            <div class="card-title">✍️ 记录本局</div>
            <div class="round-form">
                <div class="form-group">
                    <label>赢家</label>
                    <select id="winner">
                        <option value="0">选择赢家</option>
                        <option value="1">东家</option>
                        <option value="2">南家</option>
                        <option value="3">西家</option>
                        <option value="4">北家</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>番数/金额</label>
                    <input type="number" id="amount" placeholder="输入金额" step="10">
                </div>
                <div class="form-group full">
                    <label>备注（可选）</label>
                    <input type="text" id="note" placeholder="如：自摸、杠上开花">
                </div>
            </div>
            <button class="btn btn-primary" onclick="addRound()">✅ 记录本局</button>
        </div>
        
        <!-- 历史记录 -->
        <div class="card">
            <div class="card-title">📜 历史记录</div>
            <div class="history" id="historyList">
                <div class="empty-state">暂无记录，开始第一局吧！</div>
            </div>
            <button class="btn btn-secondary" onclick="clearAll()" style="width: 100%;">🗑️ 清空所有记录</button>
        </div>
        
        <div class="footer">
            🀄 麻将计分器 | 祝您新年大吉，把把自摸！
        </div>
    </div>

    <script>
        // 数据存储
        let players = ['东', '南', '西', '北'];
        let scores = [0, 0, 0, 0];
        let history = [];
        let roundCount = 0;
        
        // 初始化
        function init() {
            loadFromStorage();
            updatePlayerInputs();
            updateScores();
            updateHistory();
        }
        
        // 从本地存储加载
        function loadFromStorage() {
            const saved = localStorage.getItem('mahjongData');
            if (saved) {
                const data = JSON.parse(saved);
                players = data.players || ['东', '南', '西', '北'];
                scores = data.scores || [0, 0, 0, 0];
                history = data.history || [];
                roundCount = data.roundCount || 0;
            }
        }
        
        // 保存到本地存储
        function saveToStorage() {
            const data = {
                players: players,
                scores: scores,
                history: history,
                roundCount: roundCount
            };
            localStorage.setItem('mahjongData', JSON.stringify(data));
        }
        
        // 更新玩家输入框
        function updatePlayerInputs() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById('player' + i).value = players[i-1];
            }
        }
        
        // 获取玩家名字
        function getPlayerNames() {
            for (let i = 1; i <= 4; i++) {
                players[i-1] = document.getElementById('player' + i).value || `玩家${i}`;
            }
        }
        
        // 更新分数显示
        function updateScores() {
            getPlayerNames();
            const grid = document.getElementById('scoresGrid');
            grid.innerHTML = '';
            
            let totalAbs = 0;
            
            for (let i = 0; i < 4; i++) {
                const score = scores[i];
                totalAbs += Math.abs(score);
                
                let cardClass = 'score-card';
                let valueClass = 'score-value ';
                
                if (score > 0) {
                    cardClass += ' positive';
                    valueClass += 'positive';
                } else if (score < 0) {
                    cardClass += ' negative';
                    valueClass += 'negative';
                } else {
                    valueClass += 'zero';
                }
                
                grid.innerHTML += `
                    <div class="${cardClass}">
                        <div class="score-name">${players[i]}</div>
                        <div class="${valueClass}">${score >= 0 ? '+' : ''}${score}</div>
                    </div>
                `;
            }
            
            document.getElementById('totalRounds').textContent = roundCount;
            document.getElementById('totalMoney').textContent = '¥' + totalAbs;
        }
        
        // 添加一局
        function addRound() {
            const winnerIndex = parseInt(document.getElementById('winner').value);
            const amount = parseInt(document.getElementById('amount').value);
            const note = document.getElementById('note').value;
            
            if (winnerIndex === 0) {
                alert('请选择赢家！');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('请输入有效的金额！');
                return;
            }
            
            getPlayerNames();
            
            // 计算分数变化
            // 假设赢家收其他三家，每家付 amount
            const winner = winnerIndex - 1;
            const changes = [0, 0, 0, 0];
            
            for (let i = 0; i < 4; i++) {
                if (i === winner) {
                    changes[i] = amount * 3; // 收三家
                    scores[i] += amount * 3;
                } else {
                    changes[i] = -amount; // 付一家
                    scores[i] -= amount;
                }
            }
            
            roundCount++;
            
            // 记录历史
            const record = {
                round: roundCount,
                winner: winner,
                winnerName: players[winner],
                amount: amount,
                changes: changes,
                note: note,
                time: new Date().toLocaleTimeString()
            };
            history.unshift(record);
            
            saveToStorage();
            updateScores();
            updateHistory();
            
            // 清空输入
            document.getElementById('winner').value = '0';
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            
            // 庆祝动画
            showCelebration();
        }
        
        // 更新历史记录
        function updateHistory() {
            const list = document.getElementById('historyList');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无记录，开始第一局吧！</div>';
                return;
            }
            
            list.innerHTML = '';
            
            history.forEach((record, index) => {
                let detail = record.changes.map((c, i) => {
                    return `${players[i]}: ${c >= 0 ? '+' : ''}${c}`;
                }).join(' | ');
                
                list.innerHTML += `
                    <div class="history-item">
                        <div class="history-info">
                            <div class="history-round">第${record.round}局 - ${record.winnerName} 赢 (+${record.amount * 3})</div>
                            <div class="history-detail">${detail}</div>
                            ${record.note ? `<div class="history-detail">📝 ${record.note}</div>` : ''}
                            <div class="history-time">${record.time}</div>
                        </div>
                        <button class="history-delete" onclick="deleteRound(${index})">撤销</button>
                    </div>
                `;
            });
        }
        
        // 删除一局
        function deleteRound(index) {
            if (!confirm('确定要撤销这局吗？')) return;
            
            const record = history[index];
            
            // 恢复分数
            for (let i = 0; i < 4; i++) {
                scores[i] -= record.changes[i];
            }
            
            history.splice(index, 1);
            roundCount--;
            
            saveToStorage();
            updateScores();
            updateHistory();
        }
        
        // 清空所有
        function clearAll() {
            if (!confirm('确定要清空所有记录吗？此操作不可恢复！')) return;
            
            players = ['东', '南', '西', '北'];
            scores = [0, 0, 0, 0];
            history = [];
            roundCount = 0;
            
            localStorage.removeItem('mahjongData');
            
            updatePlayerInputs();
            updateScores();
            updateHistory();
        }
        
        // 庆祝动画
        function showCelebration() {
            // 简单的庆祝效果
            const celebration = document.createElement('div');
            celebration.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 4em;
                z-index: 1000;
                animation: pop 0.5s ease-out forwards;
            `;
            celebration.textContent = '🎉';
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
            }, 500);
        }
        
        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pop {
                0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
                50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // 监听玩家名字变化
        for (let i = 1; i <= 4; i++) {
            document.getElementById('player' + i).addEventListener('input', function() {
                getPlayerNames();
                saveToStorage();
                updateScores();
                updateHistory();
            });
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
